<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolívar Eco-Calculator</title>
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    body {
        margin: 0;
        padding: 30px 15px;
        background: #ecfdf5;
        color: #064e3b;
    }
    .container {
        max-width: 750px;
        margin: auto;
    }
    header {
        text-align: center;
        margin-bottom: 30px;
    }
    header h1 {
        color: #047857;
        font-size: 36px;
        margin-bottom: 10px;
    }
    header p {
        color: #64748b;
        font-size: 16px;
    }
    .card {
        background: white;
        padding: 30px;
        margin-bottom: 25px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }
    h2 {
        color: #047857;
        margin-top: 0;
        margin-bottom: 25px;
    }
    label {
        display: block;
        font-weight: bold;
        margin-bottom: 10px;
        color: #065f46;
    }
    select, input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1fae5;
        border-radius: 10px;
        background: #f0fdf4;
        font-size: 15px;
        color: #064e3b;
        margin-bottom: 22px;
        outline: none;
    }
    select:focus, input:focus {
        border-color: #10b981;
    }
    button {
        width: 100%;
        padding: 15px;
        background: #059669;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: #047857;
    }
    .results {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .result-box {
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        background: #ecfdf5;
        border: 1px solid #d1fae5;
    }
    .result-box h3 {
        color: #065f46;
        font-size: 16px;
        margin-top: 0;
    }
    .result-box p {
        color: #059669;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 0;
    }
    .footer {
        text-align: center;
        color: #64748b;
        font-size: 13px;
        margin-top: 25px;
    }
    @media (max-width: 550px) {
        .results {
            grid-template-columns: 1fr;
        }
        header h1 {
            font-size: 28px;
        }
        .card {
            padding: 22px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>🌱 Bolívar Eco-Calculator</h1>
        <p>Measure your environmental impact and make a difference!</p>
    </header>
    <div class="card">
        <h2>Calculate Your Impact</h2>
        <label for="transport">Transportation</label>
        <select id="transport">
            <option value="0.08">Bus</option>
            <option value="0.21">Private Car</option>
            <option value="0.105">Shared Car</option>
            <option value="0">Bicycle / Walking</option>
        </select>
        <label for="paper">Paper Sheets Used Per Day</label>
        <input type="number" id="paper" min="0" value="0">
        <label for="recycling">Recycling Level</label>
        <select id="recycling">
            <option value="0">Low</option>
            <option value="0.25">Medium</option>
            <option value="0.50">High</option>
        </select>
        <button onclick="calculateImpact()">Calculate My Impact</button>
    </div>
    <div class="card">
        <h2>Your Weekly Results</h2>
        <div class="results">
            <div class="result-box">
                <h3>🌍 CO2 Emissions</h3>
                <p><span id="co2">0</span> kg</p>
            </div>
            <div class="result-box">
                <h3>🌱 Eco-Points</h3>
                <p><span id="points">0</span></p>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>Bolívar Eco-Calculator | Colegio Bolívar</p>
        <p>Small actions create a greener future.</p>
    </div>
</div>
<script>
    function calculateImpact() {
        // Get user inputs
        let transport = Number(document.getElementById("transport").value);
        let paper = Number(document.getElementById("paper").value);
        let recycling = Number(document.getElementById("recycling").value);
        // Validate paper input
        if (paper < 0 || !Number.isFinite(paper)) {
            alert("Please enter a valid number of paper sheets.");
            return;
        }
        // Define estimation values
        let distancePerDay = 10;
        let schoolDays = 5;
        let paperEmission = 0.005;
        // Calculate weekly transportation emissions
        let transportCO2 = transport * distancePerDay * schoolDays;
        // Calculate weekly paper emissions
        let paperCO2 = paper * paperEmission * schoolDays;
        // Apply recycling reduction
        paperCO2 = paperCO2 * (1 - recycling);
        // Calculate total weekly CO2 emissions
        let totalCO2 = transportCO2 + paperCO2;
        // Calculate Eco-Points
        let recyclingBonus = recycling * 40;
        let ecoPoints = Math.min(100, Math.max(0, 100 - (totalCO2 * 2) + recyclingBonus));
        // Display results
        document.getElementById("co2").textContent = totalCO2.toFixed(2);
        document.getElementById("points").textContent = ecoPoints.toFixed(0);
    }
</script>
</body>
</html>

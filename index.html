<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolívar Eco-Calculator</title>
</head>

<body>

    <h1>Bolívar Eco-Calculator</h1>

    <h2>Calculate Your Weekly Environmental Impact</h2>

    <!-- Transportation -->
    <label for="transport">Transportation:</label>
    <select id="transport">
        <option value="0.08">Bus</option>
        <option value="0.21">Private Car</option>
        <option value="0.105">Shared Car</option>
        <option value="0">Bicycle/Walking</option>
    </select>

    <br><br>

    <!-- Paper Usage -->
    <label for="paper">Paper sheets used per day:</label>
    <input type="number" id="paper" min="0" value="0">

    <br><br>

    <!-- Recycling Level -->
    <label for="recycling">Recycling Level:</label>
    <select id="recycling">
        <option value="0">Low</option>
        <option value="0.25">Medium</option>
        <option value="0.50">High</option>
    </select>

    <br><br>

    <!-- Calculate Button -->
    <button onclick="calculateImpact()">Calculate</button>

    <!-- Results -->
    <h2>Weekly Results</h2>

    <p>CO2 Emissions: <span id="co2">0</span> kg</p>

    <p>Eco-Points: <span id="points">0</span> points</p>

    <script>

        function calculateImpact() {

            // Get user inputs
            let transport = Number(document.getElementById("transport").value);
            let paper = Number(document.getElementById("paper").value);
            let recycling = Number(document.getElementById("recycling").value);

            // Validate paper input
            if (paper < 0 || !Number.isFinite(paper)) {
                alert("Please enter a valid number of paper sheets.");
                return;
            }

            // Define estimation values
            let distancePerDay = 10;
            let schoolDays = 5;
            let paperEmission = 0.005;

            // Calculate weekly transportation emissions
            let transportCO2 = transport * distancePerDay * schoolDays;

            // Calculate weekly paper emissions
            let paperCO2 = paper * paperEmission * schoolDays;

            // Apply recycling reduction
            paperCO2 = paperCO2 * (1 - recycling);

            // Calculate total weekly CO2 emissions
            let totalCO2 = transportCO2 + paperCO2;

            // Calculate Eco-Points
            let recyclingBonus = recycling * 40;
            let ecoPoints = Math.min(100, Math.max(0, 100 - (totalCO2 * 2) + recyclingBonus));

            // Display results
            document.getElementById("co2").textContent = totalCO2.toFixed(2);

            document.getElementById("points").textContent = ecoPoints.toFixed(0);

        }

    </script>

</body>
</html>
